<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подарок викусену</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg bg-dark"></div>
<div class="bg bg-pink"></div>
<div id="stars"></div>
<div id="rain"></div>

<!-- Экран 1: карточка-подарок -->
<section class="intro">
  <div class="card" id="card">
    <div class="core"></div>
    <div class="half l"><div class="face"><span class="spark">✦ ♥ ✦</span><h1>Подарок<br>викусену</h1></div></div>
    <div class="half r" aria-hidden="true"><div class="face"><span class="spark">✦ ♥ ✦</span><h1>Подарок<br>викусену</h1></div></div>
    <svg class="crack" viewBox="0 0 100 90" aria-hidden="true"><path data-heart pathLength="1"/></svg>
    <button id="openBtn" type="button">Открыть</button>
  </div>
</section>

<!-- Объёмное сердце -->
<div class="heart3d" id="heart3d" aria-hidden="true"><div class="h3" id="h3"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="hg" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#ffb3d1"/><stop offset=".5" stop-color="#ff5c98"/><stop offset="1" stop-color="#d81b60"/>
    </radialGradient>
  </defs>
</svg>

<!-- Экран 2: финальная сцена -->
<main class="stage-wrap">
  <div class="stage" id="stage">
    <svg class="scene" viewBox="0 0 400 480" role="img" aria-label="Влюблённая пара целуется">
      <defs>
        <radialGradient id="sg"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="200" cy="250" r="200" fill="url(#sg)"/>
      <g class="cloud" fill="#fff" opacity=".85"><ellipse cx="70" cy="70" rx="40" ry="14"/><ellipse cx="92" cy="58" rx="26" ry="14"/><ellipse cx="50" cy="62" rx="22" ry="11"/></g>
      <g class="cloud c2" fill="#fff" opacity=".7"><ellipse cx="325" cy="118" rx="36" ry="12"/><ellipse cx="345" cy="107" rx="22" ry="12"/><ellipse cx="308" cy="110" rx="18" ry="9"/></g>
      <ellipse cx="200" cy="440" rx="190" ry="30" fill="#ffc4dc"/>
      <ellipse cx="200" cy="436" rx="150" ry="21" fill="#ffd9e8"/>
      <ellipse cx="200" cy="438" rx="105" ry="9" fill="#b4486f" opacity=".18"/>

      <g stroke="#2a1530" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <!-- Девочка: тело -->
        <g id="girlBody">
          <rect x="243" y="278" width="14" height="24" fill="#ffe2d2"/>
          <rect x="236" y="390" width="12" height="42" rx="6" fill="#ffe2d2"/>
          <rect x="254" y="390" width="12" height="42" rx="6" fill="#ffe2d2"/>
          <ellipse cx="242" cy="434" rx="12" ry="6" fill="#a0624a"/>
          <ellipse cx="260" cy="434" rx="12" ry="6" fill="#a0624a"/>
          <path d="M220 296Q250 284 280 296L296 394Q250 408 204 394Z" fill="#f4b8cb"/>
          <path d="M224 306Q206 320 188 306" fill="none" stroke="#f4b8cb" stroke-width="14"/>
        </g>
        <!-- Мальчик: тело (оверсайз-худи) -->
        <g id="boyBody">
          <rect x="124" y="338" width="24" height="94" rx="11" fill="#3b3a52"/>
          <rect x="152" y="338" width="24" height="94" rx="11" fill="#3b3a52"/>
          <ellipse cx="134" cy="434" rx="18" ry="8" fill="#fff"/>
          <ellipse cx="166" cy="434" rx="18" ry="8" fill="#fff"/>
          <path d="M98 214Q100 196 126 192L174 192Q200 196 202 214L210 362Q150 380 90 362Z" fill="#1c1c24"/>
          <path d="M112 318Q150 336 188 318L194 352Q150 366 106 352Z" fill="#272733"/>
          <ellipse cx="150" cy="196" rx="32" ry="13" fill="#121218"/>
          <path d="M140 205L138 245M160 205L162 245" stroke="#e9e9f2" stroke-width="3" fill="none"/>
          <path d="M104 222Q80 280 96 336" fill="none" stroke="#1c1c24" stroke-width="28"/>
          <circle cx="96" cy="344" r="9" fill="#ffe2d2"/>
          <path d="M198 222Q238 244 244 296" fill="none" stroke="#1c1c24" stroke-width="28"/>
          <circle cx="244" cy="304" r="9" fill="#ffe2d2"/>
        </g>
        <!-- Девочка: голова -->
        <g id="girlHead">
          <path d="M212 252Q206 202 252 202Q298 202 292 252L300 322Q252 340 204 322Z" fill="#6a3d28"/>
          <ellipse cx="252" cy="252" rx="36" ry="34" fill="#ffe2d2"/>
          <path d="M215 254Q210 214 252 214Q294 214 289 254Q284 234 266 230Q256 244 244 230Q224 236 215 254Z" fill="#8a5233"/>
          <g fill="#ff7eb3" stroke-width="1.5"><ellipse cx="276" cy="222" rx="9" ry="6" transform="rotate(-20 276 222)"/><ellipse cx="292" cy="222" rx="9" ry="6" transform="rotate(20 292 222)"/><circle cx="284" cy="223" r="4"/></g>
          <g class="eye"><ellipse cx="240" cy="260" rx="4.2" ry="6" fill="#2a1530" stroke="none"/><circle cx="238.6" cy="257.6" r="1.5" fill="#fff" stroke="none"/></g>
          <g class="eye"><ellipse cx="264" cy="260" rx="4.2" ry="6" fill="#2a1530" stroke="none"/><circle cx="262.6" cy="257.6" r="1.5" fill="#fff" stroke="none"/></g>
          <ellipse cx="228" cy="270" rx="7" ry="4" fill="#ff9db8" opacity=".6" stroke="none"/>
          <ellipse cx="276" cy="270" rx="7" ry="4" fill="#ff9db8" opacity=".6" stroke="none"/>
          <path class="mouth" d="M246 272Q252 278 258 272" fill="none" stroke-width="2"/>
        </g>
        <!-- Мальчик: голова -->
        <g id="boyHead">
          <ellipse cx="150" cy="140" rx="41" ry="38" fill="#ffe2d2"/>
          <path d="M106 142Q100 90 150 88Q202 90 194 142Q190 120 172 116Q164 130 150 114Q136 130 126 116Q110 122 106 142Z" fill="#f6f7ff"/>
          <path d="M106 142Q103 162 112 170Q114 152 119 142Z" fill="#f6f7ff"/>
          <path d="M194 142Q197 162 188 170Q186 152 181 142Z" fill="#f6f7ff"/>
          <g class="eye"><ellipse cx="136" cy="148" rx="4.2" ry="6" fill="#2a1530" stroke="none"/><circle cx="134.6" cy="145.6" r="1.5" fill="#fff" stroke="none"/></g>
          <g class="eye"><ellipse cx="164" cy="148" rx="4.2" ry="6" fill="#2a1530" stroke="none"/><circle cx="162.6" cy="145.6" r="1.5" fill="#fff" stroke="none"/></g>
          <ellipse cx="124" cy="158" rx="7" ry="4" fill="#ff9db8" opacity=".6" stroke="none"/>
          <ellipse cx="176" cy="158" rx="7" ry="4" fill="#ff9db8" opacity=".6" stroke="none"/>
          <path class="mouth" d="M144 160Q150 166 156 160" fill="none" stroke-width="2"/>
        </g>
      </g>
    </svg>
    <div class="hearts" id="hearts"></div>
  </div>
</main>

<!-- Музыка: файл music.mp3 лежит рядом с index.html -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button id="music" class="muted" type="button" aria-label="Включить музыку" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/>
  </svg>
</button>

<script src="script.js"></script>
</body>
</html>
